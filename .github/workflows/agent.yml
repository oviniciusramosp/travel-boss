name: Validate private server and agent tools
on:
  pull_request:
  push:
    branches: [feat/mac-mini-agent-performance]
permissions:
  contents: read
concurrency:
  group: agent-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            node: '22'
          - os: ubuntu-latest
            node: '24'
          - os: macos-latest
            node: '22'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run build:private
      - run: npm run build:server
      - name: Validate CLI, MCP and local installer
        run: npm run test:agent-runtime
      - run: npm run test:server
      - run: node --test scripts/mac-mini-deploy.test.mjs
      - name: Validate measured model trace reports
        run: node --test scripts/benchmark-traces.test.mjs
      - run: npm run benchmark:agent
      - name: Benchmark representative agent workflows
        run: npm run benchmark:workflows
